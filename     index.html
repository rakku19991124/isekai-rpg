<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>別世界の冒険譚</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efe8d8;color:#29251f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
#app{max-width:760px;margin:auto;padding:12px 12px 30px}
header{background:#5b7651;color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:12px;opacity:.9}
.panel{background:#fffdf8;border:1px solid #d8cfbd;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0000000c}
h2{font-size:19px;margin:0 0 10px}.desc{line-height:1.65}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stat{background:#f4efe4;padding:8px;border-radius:10px;font-size:14px}
button{width:100%;border:0;border-radius:11px;padding:13px 10px;margin:4px 0;background:#647f59;color:#fff;font-size:16px;font-weight:600}
button.secondary{background:#8b806e}button.warn{background:#9a6b52}button:disabled{opacity:.45}
.log{white-space:pre-wrap;line-height:1.55;min-height:90px;background:#f7f3eb;border-radius:11px;padding:10px;font-size:14px}
.enemy{font-size:19px;font-weight:700}.hpbar{height:10px;background:#ddd;border-radius:99px;overflow:hidden}.hpfill{height:100%;background:#76965f}
.small{font-size:12px;color:#716b60}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#e7dfcf;margin:2px;font-size:12px}
.choice{display:flex;gap:7px;align-items:center}.choice button{flex:1}
footer{text-align:center;color:#777;font-size:11px;margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="isekai_rpg_complete_v1";
const jobs={
 human:{name:"人間",maxLevel:3,skill:"力ため",desc:"最初の職業。弱いが、ここから様々な職業へ進める。"},
 slime:{name:"スライム",group:"ぷるん族",maxLevel:10,skill:"ぷるぷる",desc:"守りが得意なモンスター職。"},
 goblin:{name:"ゴブリン",group:"グルム族",maxLevel:10,skill:"なぐる",desc:"攻撃が得意なモンスター職。"},
 wolf:{name:"魔狼",group:"",maxLevel:10,skill:"とおぼえ",desc:"素早さに優れ、少し魔力も扱えるモンスター職。"},
 magic:{name:"マジックン",group:"",maxLevel:10,skill:"まほう",desc:"魔法を得意とするモンスター職。"},
 healer:{name:"ヒーリン",group:"",maxLevel:10,skill:"いやし",desc:"回復を得意とするモンスター職。"}
};
const monsters={
 "ぷに":{hp:5,atk:1,def:0,exp:2,gold:1,actions:["こうげき"]},
 "ゴブリン":{hp:10,atk:2,def:1,exp:4,gold:2,actions:["こうげき","なぐる"]},
 "魔狼":{hp:14,atk:3,def:1,exp:6,gold:3,actions:["こうげき","とおぼえ"]},
 "モグラビ":{hp:18,atk:3,def:2,exp:8,gold:4,actions:["ほのお","みず","くさ"]}
};
let S=load()||{
 screen:"town",gold:0,exp:0,level:1,job:"human",jobLevel:1,
 player:{hp:20,maxhp:20,mp:5,maxmp:5,atk:4,def:3,spd:3,mag:2},
 dungeon:{floor:1,cleared:false},enemy:null,charge:0,log:["冒険が始まった。"],
 inventory:{herb:3},world:"太陽の平原"
};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function addLog(x){S.log.push(x);if(S.log.length>12)S.log.shift()}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function dmg(v){return Math.max(1,Math.floor(v+(Math.random()*2-1)*v/10))}
function healFull(){S.player.hp=S.player.maxhp;S.player.mp=S.player.maxmp}
function esc(t){return t.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function render(){
 const p=S.player,j=jobs[S.job],app=document.getElementById("app");
 app.innerHTML=`<header><h1>別世界の冒険譚</h1><div class="sub">${S.world}　/　${j.name} Lv.${S.jobLevel}　所持金 ${S.gold}G</div></header>${screen()}<footer>セーブは自動です</footer>`;
 save();
}
function base(){
 const p=S.player;
 return `<div class="panel"><h2>${esc(jobs[S.job].name)} Lv.${S.jobLevel}</h2>
 <div class="stats"><div class="stat">HP ${p.hp}/${p.maxhp}</div><div class="stat">MP ${p.mp}/${p.maxmp}</div>
 <div class="stat">こうげき ${p.atk}</div><div class="stat">ぼうぎょ ${p.def}</div>
 <div class="stat">すばやさ ${p.spd}</div><div class="stat">経験値 ${S.exp}</div></div></div>`;
}
function screen(){
 if(S.screen==="town")return town();
 if(S.screen==="forest")return forest();
 if(S.screen==="battle")return battle();
 if(S.screen==="temple")return temple();
 if(S.screen==="shop")return shop();
 if(S.screen==="inn")return inn();
 if(S.screen==="status")return status();
 return town();
}
function town(){
return base()+`<div class="panel"><h2>街</h2><p class="desc">別世界を旅する冒険者の拠点。人間として始まり、冒険を通じてモンスター職へ進める。</p>
<div class="grid"><button onclick="go('forest')">若葉の森</button><button onclick="go('inn')">宿屋</button>
<button onclick="go('shop')">道具屋</button><button onclick="go('temple')">神殿</button></div></div>
<div class="panel"><div class="log">${S.log.map(esc).join("\\n")}</div></div>
<div class="grid"><button class="secondary" onclick="go('status')">ステータス</button><button class="warn" onclick="resetGame()">最初から</button></div>`;
}
function forest(){
return base()+`<div class="panel"><h2>若葉の森</h2><p class="desc">木漏れ日の差す最初のダンジョン。奥へ進むほど強いモンスターが現れる。</p>
<div class="tag">現在 ${S.dungeon.floor}階層</div>
<button onclick="explore()">探索する</button>
<button class="secondary" onclick="go('town')">街へ戻る</button></div>
<div class="panel"><div class="log">${S.log.map(esc).join("\\n")}</div></div>`;
}
function battle(){
 const e=S.enemy,p=S.player;
 return base()+`<div class="panel"><div class="enemy">${esc(e.name)}</div><div>HP ${Math.max(0,e.hp)}/${e.maxhp}</div>
<div class="hpbar"><div class="hpfill" style="width:${Math.max(0,e.hp/e.maxhp*100)}%"></div></div>
<p class="small">弱点を狙うと有利。ダメージには少しランダム幅があります。</p>
<div class="grid"><button onclick="playerAttack('normal')">こうげき</button><button onclick="playerAttack('charge')">力ため</button>
<button onclick="playerAttack('skill')">${esc(jobs[S.job].skill)}</button><button onclick="useHerb()">やくそう (${S.inventory.herb})</button></div>
<button class="secondary" onclick="runAway()">にげる</button></div>
<div class="panel"><div class="log">${S.log.map(esc).join("\\n")}</div></div>`;
}
function temple(){
 let choices=Object.entries(jobs).filter(([k])=>k!=="human").map(([k,j])=>
 `<button onclick="changeJob('${k}')">${j.name}${j.group?"（"+j.group+"）":""}<br><span class="small">${j.desc}</span></button>`).join("");
 return base()+`<div class="panel"><h2>神殿</h2><p class="desc">「○○の証」を扱い、職業を変更する場所。今は冒険の進行で証を集める仕組みです。</p>${choices}
<button class="secondary" onclick="go('town')">戻る</button></div>`;
}
function shop(){
 return base()+`<div class="panel"><h2>道具屋</h2><p>やくそう：20G　HPを回復する。</p><button onclick="buyHerb()">やくそうを買う</button><button class="secondary" onclick="go('town')">戻る</button></div>`;
}
function inn(){
 return base()+`<div class="panel"><h2>宿屋</h2><p>10GでHP・MPを全回復。</p><button onclick="stayInn()">泊まる</button><button class="secondary" onclick="go('town')">戻る</button></div>`;
}
function status(){
 const p=S.player,j=jobs[S.job];
 return base()+`<div class="panel"><h2>ステータス</h2><p>${j.desc}</p>
 <p>最大職業レベル：${j.maxLevel}</p><p>職業スキル：${j.skill}</p>
 <p>所持金：${S.gold}G<br>経験値：${S.exp}<br>やくそう：${S.inventory.herb}</p>
 <button class="secondary" onclick="go('town')">戻る</button></div>`;
}
function go(x){S.screen=x;render()}
function explore(){
 let r=Math.random(),name=r<.48?"ぷに":r<.78?"ゴブリン":r<.94?"魔狼":"モグラビ";
 let m=monsters[name];S.enemy={name,hp:m.hp,maxhp:m.hp,atk:m.atk,def:m.def,exp:m.exp,gold:m.gold,actions:m.actions};
 S.screen="battle";addLog(`${name}があらわれた！`);render();
}
function playerAttack(type){
 const p=S.player,e=S.enemy;
 let amount;
 if(type==="charge"){S.charge+=1;addLog("力をためた！");enemyTurn();render();return}
 if(type==="skill"){
   if(S.job==="healer"){let n=7+S.jobLevel; p.hp=Math.min(p.maxhp,p.hp+n);addLog(`いやし！ HPが${n}回復した。`);enemyTurn();render();return}
   if(S.job==="magic"){if(p.mp<2){addLog("MPが足りない！");render();return}p.mp-=2;amount=dmg(p.mag+5);addLog(`まほう！ ${amount}ダメージ！`)}
   else if(S.job==="slime"){amount=dmg(p.def+2);addLog(`ぷるぷる！ ${amount}ダメージ！`)}
   else if(S.job==="goblin"){amount=dmg(p.atk+4);addLog(`なぐる！ ${amount}ダメージ！`)}
   else if(S.job==="wolf"){amount=dmg(p.atk+3);addLog(`とおぼえ！ 次の攻撃が強くなる！`);S.charge+=1;enemyTurn();render();return}
   else {amount=dmg(p.atk+3);addLog(`力ため攻撃！ ${amount}ダメージ！`)}
 }else{amount=dmg(p.atk+S.charge*3);S.charge=0;addLog(`こうげき！ ${amount}ダメージ！`)}
 amount=Math.max(1,amount-e.def);
 e.hp-=amount;addLog(`${amount}ダメージ！`);
 if(e.hp<=0){victory();return}enemyTurn();render();
}
function enemyTurn(){
 const e=S.enemy,p=S.player;
 let act=e.actions[rand(0,e.actions.length-1)],d;
 if(e.name==="モグラビ"){d=dmg(e.atk);addLog(`${e.name}の${act}！`)}
 else if(e.name==="ゴブリン"&&act==="なぐる"){d=dmg(e.atk+2);addLog("ゴブリンの なぐる！")}
 else if(e.name==="魔狼"&&act==="とおぼえ"){addLog("魔狼の とおぼえ！");p.spd=Math.max(1,p.spd-1);return}
 else{d=dmg(e.atk);addLog(`${e.name}の こうげき！`)}
 d=Math.max(1,d-p.def);p.hp-=d;addLog(`${d}ダメージ！`);
 if(p.hp<=0){p.hp=Math.max(1,Math.floor(p.maxhp/3));S.screen="town";S.enemy=null;addLog("力尽き、街へ戻された。");}
}
function victory(){
 const e=S.enemy;S.exp+=e.exp;S.gold+=e.gold;addLog(`${e.name}をたおした！ EXP ${e.exp} / ${e.gold}G`);
 levelCheck();S.enemy=null;S.screen="forest";render();
}
function levelCheck(){
 const need=S.jobLevel*10;
 if(S.exp>=need && S.jobLevel<jobs[S.job].maxLevel){
  S.exp-=need;S.jobLevel++;
  S.player.maxhp+=3;S.player.maxmp+=1;S.player.atk+=1;S.player.def+=1;
  S.player.hp=S.player.maxhp;S.player.mp=S.player.maxmp;
  addLog(`${jobs[S.job].name}がレベル${S.jobLevel}になった！`);
 }
}
function runAway(){addLog("戦闘から逃げた。");S.enemy=null;S.screen="forest";render()}
function useHerb(){if(S.inventory.herb<=0){addLog("やくそうがない！");render();return}S.inventory.herb--;let n=8;S.player.hp=Math.min(S.player.maxhp,S.player.hp+n);addLog(`やくそうでHPが${n}回復した。`);enemyTurn();render()}
function buyHerb(){if(S.gold<20){alert("お金が足りません。");return}S.gold-=20;S.inventory.herb++;addLog("やくそうを買った。");render()}
function stayInn(){if(S.gold<10){alert("お金が足りません。");return}S.gold-=10;healFull();addLog("宿屋で全回復した。");render()}
function changeJob(k){
 if(S.job===k){alert("すでにその職業です。");return}
 if(S.job==="human"&&S.level<1){return}
 S.job=k;S.jobLevel=1;healFull();
 S.player.atk+=2;S.player.def+=1;S.player.maxhp+=4;S.player.maxmp+=1;
 addLog(`職業を${jobs[k].name}に変更した！`);
 S.screen="town";render();
}
function resetGame(){if(confirm("ゲームを最初からやり直しますか？")){localStorage.removeItem(KEY);location.reload()}}
render();
</script>
</body>
</html>
